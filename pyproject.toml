[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aiida-analyser"
dynamic = ["version"]
description = "AiiDA analysis helpers for Quantum ESPRESSO, EPW, and related AiiDA workflows."
authors = [{name = "Yiming Zhang", email = "yiming.zhang@uclouvain.be"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Framework :: AiiDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["aiida", "postprocessing"]
requires-python = ">=3.9"
dependencies = [
    "aiida-core[atomic_tools]~=2.6",
    "aiida-quantumespresso>=4.11",
    "aiida-wannier90-workflows",
    "loguru",
    "PyYAML",
    "rich",
]

[project.urls]
Home = "https://github.com/ymzhang0/aiida-analyser"
Source = "https://github.com/ymzhang0/aiida-analyser"

[project.optional-dependencies]
structure = [
    "ase",
]
thermo = [
    "ipywidgets",
    "matplotlib",
    "numpy",
    "pandas",
]
dislocation = [
    "aiida-dislocation",
    "ase",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]
epw = [
    "aiida-epw",
    "ase",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]
all = [
    "aiida-dislocation",
    "aiida-epw",
    "ase",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-book-theme",
    "sphinx-rtd-theme",
]
pre-commit = [
    "pre-commit",
    "pylint",
]
tests = [
    "pytest",
    "pytest-regressions",
]
dev = [
    "aiida-dislocation",
    "aiida-epw",
    "ase",
    "ipywidgets",
    "matplotlib",
    "myst-parser",
    "numpy",
    "pandas",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-regressions",
    "scipy",
    "sphinx",
    "sphinx-book-theme",
    "sphinx-rtd-theme",
]

[tool.flit.module]
name = "aiida_analyser"

[tool.pylint.format]
max-line-length = 125

[tool.pylint.messages_control]
disable = [
    "too-many-ancestors",
    "invalid-name",
    "duplicate-code",
    # black compatibility
    "C0330",
    "C0326",
]

[tool.pytest.ini_options]
python_files = "test_*.py example_*.py"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:django:",
    "ignore::DeprecationWarning:yaml:",
]

[tool.coverage.run]
source = ["aiida_analyser"]

[tool.isort]
line_length = 120
force_sort_within_sections = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'AIIDA', 'FIRSTPARTY', 'LOCALFOLDER']
known_aiida = ['aiida']

[tool.tox]
legacy_tox_ini = """
[tox]
envlist =
    py{39,310,311,312}
    pre-commit

[testenv]
usedevelop=True

[testenv:py{39,310,311,312}]
description = Run the test suite against a python version
extras = tests
commands = pytest {posargs}

[testenv:pre-commit]
description = Run the pre-commit checks
extras = pre-commit
commands = pre-commit run {posargs}

[testenv:docs]
description = Build the documentation
extras = docs
commands = sphinx-build -nW --keep-going -b html {posargs} docs/source docs/build/html
commands_post = echo "open file://{toxinidir}/docs/build/html/index.html"
"""
